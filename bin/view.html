<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #16181d; --muted: #6b6f78; --line: #e6e3dc;
    --accent: #2563eb; --accent-soft: #e8efff; --code-bg: #f0eee8; --side: #fbfaf7;
    --ok: #2b8a3e; --ok-soft: #d3f9d8; --warn: #b35c00; --warn-soft: #fff3bf; --bad: #c92a2a; --bad-soft: #ffe3e3;
    --shadow: 0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121315; --panel: #1b1c1f; --text: #ececef; --muted: #9a9ca5; --line: #2a2b30;
      --accent: #7aa7ff; --accent-soft: #1d2740; --code-bg: #24252a; --side: #161719;
      --ok-soft: #173d24; --warn-soft: #3d3016; --bad-soft: #3d1a1a; --ok: #69db7c; --warn: #ffc078; --bad: #ff8787;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121315; --panel: #1b1c1f; --text: #ececef; --muted: #9a9ca5; --line: #2a2b30;
    --accent: #7aa7ff; --accent-soft: #1d2740; --code-bg: #24252a; --side: #161719;
    --ok-soft: #173d24; --warn-soft: #3d3016; --bad-soft: #3d1a1a; --ok: #69db7c; --warn: #ffc078; --bad: #ff8787;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .layout { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }

  /* sidebar */
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; gap: 10px; align-items: center; margin: 0 6px 4px; }
  .brand .dot { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
  .brand b { font-size: 15px; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 6px 14px 46px; }
  .search { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; margin-bottom: 6px; }
  .group { margin: 16px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  nav a { display: block; padding: 5px 10px; border-radius: 7px; color: var(--text); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav a:hover { background: var(--accent-soft); text-decoration: none; }
  nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  main { padding: 36px 52px 90px; max-width: 1120px; width: 100%; }
  .toolbar { position: fixed; top: 14px; right: 18px; display: flex; gap: 8px; z-index: 5; }
  .toolbar button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 12.5px; box-shadow: var(--shadow); }

  /* home */
  .hero h1 { font-size: 34px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 10px; }
  .hero p { font-size: 17px; color: var(--muted); margin: 0 0 24px; max-width: 780px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 26px; line-height: 1.1; font-weight: 800; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .h { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; display: flex; justify-content: space-between; }
  .h a { text-transform: none; letter-spacing: 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--text); box-shadow: var(--shadow); }
  a.card:hover { border-color: var(--accent); text-decoration: none; }
  .card b { display: block; font-size: 14.5px; margin-bottom: 4px; }
  .card small { color: var(--muted); font-size: 12.5px; line-height: 1.45; display: block; }
  .timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .timeline a, .timeline div.row { display: grid; grid-template-columns: 128px 76px 1fr; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); color: var(--text); font-size: 14px; align-items: center; }
  .timeline > :first-child { border-top: 0; }
  .timeline a:hover { background: var(--accent-soft); text-decoration: none; }
  .timeline time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .home .stage svg { max-height: 420px; }
  tr.hidden { display: none; }
  .morerows { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--panel); color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; padding: 8px; cursor: pointer; }

  /* badges & chips */
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--code-bg); color: var(--muted); text-align: center; }
  .badge.feature { background: var(--accent-soft); color: var(--accent); }
  .badge.fix { background: var(--bad-soft); color: var(--bad); }
  .badge.infra, .badge.data { background: var(--warn-soft); color: var(--warn); }
  .badge.accepted, .badge.done { background: var(--ok-soft); color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 26px; }
  .chip { font-size: 12.5px; padding: 4px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .chips .badge { font-size: 12.5px; padding: 4px 12px; align-self: center; }

  /* article */
  article h1 { font-size: 30px; line-height: 1.2; letter-spacing: -.015em; margin: 0 0 12px; }
  article h2 { font-size: 19px; margin: 34px 0 12px; }
  article h3 { font-size: 15.5px; margin: 22px 0 8px; }
  article p, article li { max-width: 780px; }
  article ul, article ol { padding-left: 22px; }
  article li { margin: 3px 0; }
  article blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  article blockquote p { margin: 2px 0; }
  code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--code-bg); }
  details.more { margin: 10px 0; }
  details.more > summary { cursor: pointer; list-style: none; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--accent); padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "▸"; transition: transform .15s; }
  details.more[open] > summary::before { transform: rotate(90deg); }
  /* interactive diagrams (always on white so Mermaid colours stay readable) */
  .diagram { background: #fff; color: #16181d; border: 1px solid var(--line); border-radius: 14px; margin: 14px 0 18px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .diagram.err { padding: 16px; color: #c92a2a; font-size: 13px; display: block; }
  .dtools { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 8px 10px; border-bottom: 1px solid #eeece6; background: #fbfaf7; flex-wrap: wrap; }
  .dtools button { min-width: 30px; height: 28px; padding: 0 9px; border: 1px solid #e3e0d8; border-radius: 7px; background: #fff; color: #16181d; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .dtools button:hover:not(:disabled) { border-color: #2563eb; color: #2563eb; }
  .dtools button:disabled { opacity: .35; cursor: default; }
  .dtools .step { font: 600 12.5px Inter, sans-serif; color: #6b6f78; min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .dtools .stepper { display: flex; gap: 6px; align-items: center; margin-right: auto; }
  .stage { padding: 16px; text-align: center; }
  .stage svg { width: 100%; height: auto; max-height: 70vh; cursor: grab; touch-action: none; user-select: none; }
  .stage svg.grabbing { cursor: grabbing; }
  .caption { padding: 9px 14px; border-top: 1px solid #eeece6; background: #fbfaf7; font-size: 13px; color: #4b5059; min-height: 38px; line-height: 1.5; }
  .caption b { color: #16181d; } .caption em { color: #6b6f78; font-style: normal; }
  .diagram.full { position: fixed; inset: 12px; z-index: 60; margin: 0; box-shadow: 0 0 0 100vmax rgba(10,12,16,.6); }
  .diagram.full .stage { flex: 1; min-height: 0; display: flex; }
  .diagram.full .stage svg { max-height: none; height: 100%; }
  body.noscroll { overflow: hidden; }
  /* flowchart tracing */
  svg.dim g.node, svg.dim path.flowchart-link, svg.dim g.edgeLabel, svg.dim g.cluster { opacity: .14; transition: opacity .15s; }
  svg.dim .hl { opacity: 1 !important; }
  svg.dim g.node.hl-root rect, svg.dim g.node.hl-root polygon, svg.dim g.node.hl-root path, svg.dim g.node.hl-root circle { stroke: #2563eb !important; stroke-width: 3px !important; }
  svg.dim path.flowchart-link.hl { stroke: #2563eb !important; stroke-width: 2.5px !important; }
  /* sequence stepping */
  svg.seq-dim .messageText, svg.seq-dim .messageLine0, svg.seq-dim .messageLine1 { opacity: .12; transition: opacity .15s; }
  svg.seq-dim .seen { opacity: .45 !important; }
  svg.seq-dim .cur { opacity: 1 !important; }
  svg.seq-dim line.cur, svg.seq-dim path.cur { stroke: #2563eb !important; stroke-width: 3px !important; }
  svg.seq-dim text.cur { fill: #2563eb !important; font-weight: 700 !important; }
  .dead { border-bottom: 1px dotted var(--muted); }
  .folder { display: grid; gap: 10px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; }
    main { padding: 24px 16px 60px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .timeline a, .timeline div.row { grid-template-columns: 86px 1fr; }
    .timeline .badge { display: none; }
    .toolbar { position: static; justify-content: flex-end; padding: 10px 16px 0; }
  }
</style>
</head>
<body>
<div class="toolbar"><button id="details" type="button">Show all details</button><button id="theme" type="button">Theme</button></div>
<div class="layout">
  <aside>
    <div class="brand"><span class="dot" id="mono"></span><b id="brand"></b></div>
    <div class="sub" id="gen"></div>
    <input class="search" id="q" type="search" placeholder="Filter pages…" aria-label="Filter pages">
    <nav id="nav"></nav>
  </aside>
  <main><article id="doc">Loading…</article></main>
</div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

const DATA = JSON.parse(document.getElementById('data').textContent);
const files = new Map(DATA.files.map((f) => [f.path, f.md]));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
document.title = `${DATA.name} — project brain`;
$('brand').textContent = DATA.name;
$('mono').textContent = DATA.name.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || 'PB';
$('gen').textContent = `Project brain · ${DATA.generated}`;

// ---- preferences (per viewer, optional) ----
const root = document.documentElement;
const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} };
if (pref('vpos-theme')) root.dataset.theme = pref('vpos-theme');
let showAll = pref('vpos-details') === '1';
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
$('theme').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; pref('vpos-theme', root.dataset.theme); };
const syncDetailsBtn = () => { $('details').textContent = showAll ? 'Focus view' : 'Show all details'; };
$('details').onclick = () => { showAll = !showAll; pref('vpos-details', showAll ? '1' : '0'); syncDetailsBtn(); show(); };
syncDetailsBtn();

// ---- helpers over the markdown ----
const titleOf = (p) => ((files.get(p) || '').match(/^#\s+(.+)$/m) || [, p])[1].replace(/\s+—\s+.*$/, '').replace(/^Flow:\s*/, '').replace(/^ADR-(\d+):\s*/, 'ADR-$1 · ');
const firstPara = (md) => (md.replace(/<!--[\s\S]*?-->/g, '').split(/\n\s*\n/).map((b) => b.trim())
  .find((b) => b && !/^(#|>|\||```|- |\d+\.|\*\*[A-Z][^*]*:\*\*)/.test(b)) || '').replace(/\s+/g, ' ');
const section = (md, name) => { const m = md.match(new RegExp(`^##\\s+${name}[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$(?![\\s\\S]))`, 'mi')); return m ? m[1] : ''; };
const field = (md, key) => ((md.match(new RegExp(`\\*\\*${key}:?\\*\\*:?\\s*\\|?\\s*([^|\\n]+)`)) || [])[1] || '').trim();
// Markdown → plain text for summaries. Keep underscores: they are part of real names (archive_reviews.py).
const strip = (s) => s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[`*]/g, '').trim();
const short = (s, n = 110) => (s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s);
const mermaids = (md) => [...md.matchAll(/^```mermaid\r?\n([\s\S]*?)^```/gm)].map((m) => m[1]);

// ---- navigation ----
const GROUPS = [
  ['Overview', (p) => !p.includes('/')],
  ['Flows', (p) => p.startsWith('flows/')],
  ['Features', (p) => p.startsWith('features/')],
  ['Decisions', (p) => p.startsWith('decisions/')],
];
const ORDER = ['README.md', 'system-overview.md', 'architecture.md', 'data-model.md', 'integrations.md', 'deployment.md', 'feature-history.md'];
const nav = $('nav');
for (const [label, test] of GROUPS) {
  const paths = DATA.files.map((f) => f.path).filter(test);
  if (!paths.length) continue;
  paths.sort((a, b) => label === 'Overview' ? ORDER.indexOf(a) - ORDER.indexOf(b) : label === 'Features' ? b.localeCompare(a) : a.localeCompare(b));
  nav.insertAdjacentHTML('beforeend', `<div class="group">${label} · ${paths.length}</div>`);
  for (const p of paths) {
    const a = document.createElement('a');
    a.href = `#/${p}`;
    a.textContent = p === 'README.md' ? 'Dashboard' : titleOf(p);
    a.title = a.textContent;
    a.dataset.path = p;
    nav.appendChild(a);
  }
}
$('q').oninput = (e) => {
  const q = e.target.value.toLowerCase();
  nav.querySelectorAll('a').forEach((a) => { a.style.display = !q || a.textContent.toLowerCase().includes(q) || (files.get(a.dataset.path) || '').toLowerCase().includes(q) ? '' : 'none'; });
};

// ---- rendering ----
mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'strict', fontFamily: 'Inter, system-ui, sans-serif' });
let seq = 0;
async function renderDiagrams(scope) {
  for (const code of scope.querySelectorAll('code.language-mermaid')) {
    const box = document.createElement('div');
    box.className = 'diagram';
    (code.closest('pre') || code).replaceWith(box);
    try {
      const { svg } = await mermaid.render(`m${seq++}`, code.textContent);
      box.innerHTML = `<div class="dtools"></div><div class="stage">${svg}</div><div class="caption"></div>`;
      interactive(box);
    } catch (e) { box.classList.add('err'); box.textContent = `Diagram error: ${e.message || e}`; }
  }
}

// ---- interactive diagrams: zoom / pan / full screen, step through sequences, trace flowchart links ----
let activeBox = null;
function interactive(box) {
  const svg = box.querySelector('svg');
  const tools = box.querySelector('.dtools');
  const caption = box.querySelector('.caption');
  const vb0 = (svg.getAttribute('viewBox') || '0 0 100 100').split(/[\s,]+/).map(Number);
  let vb = [...vb0];
  const setVb = () => svg.setAttribute('viewBox', vb.join(' '));
  const zoom = (f, cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2) => {
    const w = Math.min(Math.max(vb[2] * f, vb0[2] / 8), vb0[2] * 1.5), k = w / vb[2];
    vb = [cx - (cx - vb[0]) * k, cy - (cy - vb[1]) * k, w, vb[3] * k]; setVb();
  };
  const fit = () => { vb = [...vb0]; setVb(); };
  const toPoint = (e) => { const r = svg.getBoundingClientRect(), s = Math.max(vb[2] / r.width, vb[3] / r.height);
    return [vb[0] + (e.clientX - r.left - (r.width - vb[2] / s) / 2) * s, vb[1] + (e.clientY - r.top - (r.height - vb[3] / s) / 2) * s]; };
  svg.removeAttribute('style');

  const btn = (label, title, fn) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = label; b.title = title;
    b.onclick = (e) => { e.stopPropagation(); activeBox = box; fn(); }; tools.appendChild(b); return b; };
  btn('−', 'Zoom out', () => zoom(1.25));
  btn('+', 'Zoom in', () => zoom(0.8));
  btn('Fit', 'Reset view', fit);
  const fsBtn = btn('⛶', 'Full screen (Esc to close)', () => toggleFull());
  const toggleFull = (force) => {
    const on = force ?? !box.classList.contains('full');
    box.classList.toggle('full', on); document.body.classList.toggle('noscroll', on);
    fsBtn.innerHTML = on ? '✕' : '⛶'; fit();
  };
  box.toggleFull = toggleFull;

  // Drag to pan; Ctrl/⌘ + wheel (or any wheel in full screen) to zoom.
  let drag = null;
  svg.addEventListener('pointerdown', (e) => { activeBox = box; drag = { x: e.clientX, y: e.clientY, vb: [...vb], moved: false, target: e.target }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const r = svg.getBoundingClientRect(), s = Math.max(vb[2] / r.width, vb[3] / r.height);
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) { vb[0] = drag.vb[0] - dx * s; vb[1] = drag.vb[1] - dy * s; setVb(); svg.classList.add('grabbing'); }
  });
  // Pointer capture retargets pointerup to the <svg>, so tap handling uses the pointerdown target.
  svg.addEventListener('pointerup', () => { const d = drag; drag = null; svg.classList.remove('grabbing'); if (d && !d.moved) onTap({ target: d.target }); });
  svg.addEventListener('wheel', (e) => {
    if (!box.classList.contains('full') && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault(); const [px, py] = toPoint(e); zoom(e.deltaY > 0 ? 1.12 : 0.89, px, py);
  }, { passive: false });
  svg.addEventListener('dblclick', () => toggleFull());

  let onTap = () => {};
  if (svg.querySelector('.messageText')) onTap = sequenceSteps(svg, tools, caption, (x, y) => {
    if (vb[2] < vb0[2] * 0.95) { vb[0] = x - vb[2] / 2; vb[1] = y - vb[3] / 2; setVb(); }
  });
  else if (svg.querySelector('g.node')) onTap = traceLinks(svg, caption);
  else caption.textContent = 'Drag to move · Ctrl + scroll to zoom · double-click for full screen';
}

function sequenceSteps(svg, tools, caption, centerOn) {
  const texts = [...svg.querySelectorAll('.messageText')];
  const lines = [...svg.querySelectorAll('.messageLine0, .messageLine1')];
  const steps = texts.map((t, i) => ({ t, l: lines[i] })).filter((s) => s.l);
  const actors = [];
  svg.querySelectorAll('text.actor').forEach((a) => {
    const b = a.getBBox(), name = a.textContent.trim();
    const prev = actors.find((x) => x.name === name);
    if (!prev) actors.push({ name, x: b.x + b.width / 2, y: b.y }); else if (b.y < prev.y) Object.assign(prev, { x: b.x + b.width / 2, y: b.y });
  });
  const near = (x) => actors.reduce((best, a) => (Math.abs(a.x - x) < Math.abs(best.x - x) ? a : best), actors[0] || { name: '?', x: 0 }).name;
  const ends = (l) => {
    if (l.tagName === 'line') return [+l.getAttribute('x1'), +l.getAttribute('x2')];
    const m = (l.getAttribute('d') || '').match(/-?[\d.]+/g) || [0]; return [+m[0], +m[0]];
  };
  let i = -1;
  const counter = document.createElement('span'); counter.className = 'step';
  const prev = document.createElement('button'), next = document.createElement('button');
  prev.type = next.type = 'button'; prev.innerHTML = '◀'; next.innerHTML = 'Step ▶'; prev.title = 'Previous step (←)'; next.title = 'Next step (→)';
  const stepper = document.createElement('span'); stepper.className = 'stepper';
  stepper.append(prev, counter, next); tools.prepend(stepper);
  const show = () => {
    svg.classList.toggle('seq-dim', i >= 0);
    steps.forEach((s, k) => { for (const el of [s.t, s.l]) { el.classList.toggle('cur', k === i); el.classList.toggle('seen', k < i); } });
    counter.textContent = i < 0 ? `${steps.length} steps` : `${i + 1} / ${steps.length}`;
    next.innerHTML = i < 0 ? 'Walk through ▶' : '▶';
    prev.disabled = i < 0; next.disabled = i >= steps.length - 1;
    if (i < 0) { caption.textContent = 'Press “Walk through” (or →) to follow the flow one step at a time.'; return; }
    const s = steps[i], [a, b] = ends(s.l);
    caption.innerHTML = `<b>${i + 1}.</b> ${esc(near(a))} → ${esc(near(b))}: <span>${esc(s.t.textContent)}</span>`;
    const bb = s.l.getBBox(); centerOn(bb.x + bb.width / 2, bb.y + bb.height / 2);
  };
  const go = (d) => { i = Math.max(-1, Math.min(steps.length - 1, i + d)); show(); };
  prev.onclick = (e) => { e.stopPropagation(); activeBox = svg.closest('.diagram'); go(-1); };
  next.onclick = (e) => { e.stopPropagation(); activeBox = svg.closest('.diagram'); go(1); };
  svg.closest('.diagram').step = go;
  show();
  return () => {};
}

function traceLinks(svg, caption) {
  const idOf = (g) => ((g.id || '').match(/flowchart-(.+)-\d+$/) || [])[1];
  const nodes = new Map([...svg.querySelectorAll('g.node')].map((g) => [idOf(g), g]).filter(([k]) => k));
  // First line of the node label (labels are HTML inside foreignObject; <br> separates lines).
  const labelOf = (id) => {
    const g = nodes.get(id), el = g?.querySelector('foreignObject div, foreignObject span');
    return ((el ? el.innerText : g?.textContent) || id).split('\n')[0].replace(/\s+/g, ' ').trim();
  };
  const edges = [...svg.querySelectorAll('path.flowchart-link')].map((p) => {
    const raw = (p.getAttribute('data-id') || p.id.replace(/^.*?-(L_)/, '$1')).replace(/^L_/, '').replace(/_\d+$/, '');
    let from, to;
    for (let k = raw.indexOf('_'); k > 0; k = raw.indexOf('_', k + 1)) {
      if (nodes.has(raw.slice(0, k)) && nodes.has(raw.slice(k + 1))) { from = raw.slice(0, k); to = raw.slice(k + 1); break; }
    }
    const label = svg.querySelector(`g.label[data-id="${p.getAttribute('data-id')}"]`)?.closest('g.edgeLabel');
    return { p, from, to, label, text: (label?.textContent || '').trim() };
  }).filter((e) => e.from);
  const hint = 'Click a box to trace what it connects to · drag to move · double-click for full screen';
  caption.textContent = hint;
  const clear = () => { svg.classList.remove('dim'); svg.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl')); caption.textContent = hint; };
  return (e) => {
    const g = e.target.closest('g.node');
    const id = g && idOf(g);
    if (!id || g.classList.contains('hl-root')) { svg.querySelectorAll('.hl-root').forEach((x) => x.classList.remove('hl-root')); return clear(); }
    clear(); svg.classList.add('dim'); g.classList.add('hl', 'hl-root');
    const outM = new Map(), inM = new Map();
    for (const ed of edges) {
      if (ed.from !== id && ed.to !== id) continue;
      ed.p.classList.add('hl'); ed.label?.classList.add('hl');
      const other = ed.from === id ? ed.to : ed.from; nodes.get(other)?.classList.add('hl');
      const m = ed.from === id ? outM : inM;
      if (!m.has(other)) m.set(other, []);
      if (ed.text) m.get(other).push(ed.text);
    }
    const fmt = (m) => [...m].map(([o, t]) => `${esc(labelOf(o))}${t.length ? ` <em>(${esc(t.join('; '))})</em>` : ''}`);
    const out = fmt(outM), inn = fmt(inM);
    caption.innerHTML = `<b>${esc(labelOf(id))}</b>` +
      (out.length ? ` → ${out.join(', ')}` : '') + (inn.length ? `<br>← from ${inn.join(', ')}` : '') + (!out.length && !inn.length ? ' has no links' : '');
  };
}

addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, textarea')) return;
  const full = document.querySelector('.diagram.full');
  if (e.key === 'Escape' && full) return full.toggleFull(false);
  // Arrow keys drive the diagram in full screen, else the last one used, else the first sequence on the page.
  const box = full || (activeBox?.isConnected && activeBox.step ? activeBox : document.querySelector('.stepper')?.closest('.diagram'));
  if (box?.step && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); box.step(e.key === 'ArrowRight' ? 1 : -1); }
});
function resolve(from, href) {
  const parts = from.split('/').slice(0, -1);
  for (const seg of href.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  return parts.join('/') + (href.endsWith('/') ? '/' : '');
}
function fixLinks(scope, path) {
  scope.querySelectorAll('a[href]').forEach((a) => {
    const href = a.getAttribute('href');
    if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('#')) return;
    const target = resolve(path, href.split('#')[0]);
    if (files.has(target) || (target.endsWith('/') && DATA.files.some((f) => f.path.startsWith(target)))) a.setAttribute('href', `#/${target}`);
    else { const s = document.createElement('span'); s.className = 'dead'; s.title = href; s.textContent = a.textContent; a.replaceWith(s); }
  });
}

function historyRows() {
  return (files.get('feature-history.md') || '').split('\n')
    .filter((l) => /^\|\s*\d{4}-/.test(l))
    .map((l) => l.split('|').slice(1, -1).map((c) => c.trim()))
    .map(([date, type, change, record]) => ({ date, type, change: strip(change || ''), link: ((record || '').match(/\(([^)]+)\)/) || [])[1] }));
}

async function home() {
  const overview = files.get('system-overview.md') || '';
  const purpose = firstPara(section(overview, 'In one paragraph') || overview) || firstPara(files.get('README.md') || '');
  const count = (re) => DATA.files.filter((f) => re.test(f.path)).length;
  const diagrams = DATA.files.reduce((n, f) => n + mermaids(f.md).length, 0);
  const hist = historyRows();
  const stats = [[diagrams, 'diagrams'], [count(/^flows\//), 'flows'], [count(/^features\//), 'feature records'], [count(/^decisions\//), 'decisions'], [hist.length, 'changes logged']];
  const flows = DATA.files.filter((f) => f.path.startsWith('flows/')).sort((a, b) => a.path.localeCompare(b.path));
  const adrs = DATA.files.filter((f) => f.path.startsWith('decisions/')).sort((a, b) => a.path.localeCompare(b.path));
  const ctx = mermaids(overview)[0];
  const arch = mermaids(files.get('architecture.md') || '')[0];
  const doc = $('doc');
  doc.className = 'home';
  doc.innerHTML = `
    <div class="hero"><h1>${esc(DATA.name)}</h1><p>${esc(strip(purpose))}</p></div>
    <div class="stats">${stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
    ${ctx ? `<div class="h">System at a glance <a href="#/system-overview.md">Overview →</a></div><pre><code class="language-mermaid">${esc(ctx)}</code></pre>` : ''}
    ${hist.length ? `<div class="h">Recent changes <a href="#/feature-history.md">All ${hist.length} →</a></div>
      <div class="timeline">${hist.slice(0, 6).map((r) => {
        const inner = `<time>${esc(r.date)}</time><span class="badge ${esc(r.type)}">${esc(r.type)}</span><span>${esc(short(r.change, 120))}</span>`;
        return r.link && files.has(r.link) ? `<a href="#/${r.link}">${inner}</a>` : `<div class="row">${inner}</div>`;
      }).join('')}</div>` : ''}
    ${arch ? `<div class="h">Architecture <a href="#/architecture.md">Details →</a></div><pre><code class="language-mermaid">${esc(arch)}</code></pre>` : ''}
    ${flows.length ? `<div class="h">Flows</div><div class="grid">${flows.map((f) => `<a class="card" href="#/${f.path}"><b>${esc(titleOf(f.path))}</b><small>${esc(short(strip(field(f.md, 'Trigger') || firstPara(f.md)), 90))}</small></a>`).join('')}</div>` : ''}
    ${adrs.length ? `<div class="h">Decisions</div><div class="grid">${adrs.map((f) => { const st = strip(field(f.md, 'Status')).split(/\s/)[0]; return `<a class="card" href="#/${f.path}"><b>${esc(titleOf(f.path))}</b><small><span class="badge ${esc(st)}">${esc(st || '—')}</span></small></a>`; }).join('')}</div>` : ''}`;
  await renderDiagrams(doc);
}

async function page(path) {
  const doc = $('doc');
  doc.className = '';
  if (path.endsWith('/')) {
    const items = DATA.files.map((f) => f.path).filter((p) => p.startsWith(path)).sort();
    doc.innerHTML = `<h1>${esc(path)}</h1><div class="folder">${items.map((p) => `<a class="card" href="#/${p}"><b>${esc(titleOf(p))}</b><small>${esc(short(strip(firstPara(files.get(p))), 120))}</small></a>`).join('') || '<p>Empty.</p>'}</div>`;
    return;
  }
  const md = files.get(path);
  if (md === undefined) { doc.innerHTML = `<h1>Not found</h1><p>${esc(path)}</p>`; return; }

  doc.innerHTML = marked.parse(md.replace(/<!--[\s\S]*?-->/g, ''));
  fixLinks(doc, path);

  // "Last reviewed" quotes and 2-column metadata tables (empty header) become chips.
  const chips = [];
  doc.querySelectorAll('blockquote').forEach((q) => {
    const m = q.textContent.trim().match(/^(Last reviewed|Full procedure):\s*(.+)$/i);
    if (m && q.textContent.trim().split('\n').length === 1) { chips.push(`<span class="chip">${esc(m[1])} <b>${esc(m[2])}</b></span>`); q.remove(); }
  });
  doc.querySelectorAll('table').forEach((t) => {
    const head = t.querySelector('thead');
    if (head && !head.textContent.trim() && t.rows[1] && t.rows[1].cells.length === 2) {
      for (const r of [...t.tBodies[0].rows]) {
        const k = r.cells[0].textContent.trim(), v = r.cells[1];
        const cls = k === 'Type' || k === 'Status' ? v.textContent.trim().split(/\s/)[0] : '';
        chips.push(cls ? `<span class="badge ${esc(cls)}">${v.innerHTML}</span>` : `<span class="chip">${esc(k)} <b>${v.innerHTML}</b></span>`);
      }
      t.remove();
    } else if (head && !head.textContent.trim()) head.remove();
  });
  const h1 = doc.querySelector('h1');
  if (chips.length && h1) h1.insertAdjacentHTML('afterend', `<div class="chips">${chips.join('')}</div>`);

  // Focus view: long tables show their first rows; long lists fold away behind a click.
  doc.querySelectorAll('table').forEach((t) => {
    const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t);
    const rows = t.tBodies[0] ? [...t.tBodies[0].rows] : [];
    if (showAll || rows.length <= 6 || path === 'feature-history.md') return;
    rows.slice(5).forEach((r) => r.classList.add('hidden'));
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'morerows'; b.textContent = `Show ${rows.length - 5} more rows`;
    b.onclick = () => { rows.forEach((r) => r.classList.remove('hidden')); b.remove(); };
    w.appendChild(b);
  });
  doc.querySelectorAll('article > ul, article > ol').forEach((l) => {
    if (!showAll && l.children.length > 6) fold(l, `${l.children.length} items`);
  });
  await renderDiagrams(doc);
}
function fold(el, label) {
  const d = document.createElement('details'); d.className = 'more';
  d.innerHTML = `<summary>${esc(label)}</summary>`;
  el.replaceWith(d); d.appendChild(el);
}

async function show() {
  const path = decodeURIComponent(location.hash.replace(/^#\//, '')) || 'README.md';
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('active', a.dataset.path === path));
  $('details').style.visibility = path === 'README.md' ? 'hidden' : '';
  if (path === 'README.md') await home(); else await page(path);
  window.scrollTo(0, 0);
}
addEventListener('hashchange', show);
show();
</script>
